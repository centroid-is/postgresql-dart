# documentation.

name: Dart

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  analyze:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v3

      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603

      - name: Install dependencies
        run: dart pub get

      - name: Analyze project source
        run: dart analyze

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: analyze

    steps:
      - uses: actions/checkout@v3

      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603

      - name: Install dependencies
        run: dart pub get

      # pre-pull the image so `usePostgresDocker` does not delay which may causes
      # tests to timeout
      - name: pull latest postgres image
        run: docker pull postgres:latest

      # Saves coverage information in the "coverage" folder.
      - name: Run tests
        run: dart test --coverage=coverage

      - name: Test example
        run: |
          docker run --detach --name postgres_for_dart_test -p 127.0.0.1:5432:5432 -e POSTGRES_USER=user -e POSTGRES_DATABASE=database -e POSTGRES_PASSWORD=pass postgres
          dart run example/example.dart
          docker container rm --force postgres_for_dart_test

      # https://www.bradcypert.com/how-to-upload-coverage-to-codecov-for-dart/
      - name: Install coverage tools
        run: dart pub global activate coverage

      - name: format coverage
        run: $HOME/.pub-cache/bin/format_coverage --lcov --in=coverage --out=coverage.lcov --report-on=lib

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    needs: analyze

    steps:
      - uses: actions/checkout@v3

      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603

      - name: Install dependencies
        run: dart pub get

      - name: Setup PostgreSQL 17
        run: |
          brew install postgresql@17
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          echo "$(brew --prefix postgresql@17)/bin" >> $GITHUB_PATH
          brew services start postgresql@17
          sleep 3
          createuser -s user

      - name: Smoke test
        run: dart run example/example.dart

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: analyze

    steps:
      - uses: actions/checkout@v3

      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603

      - name: Install dependencies
        run: dart pub get

      - name: Setup PostgreSQL 17
        shell: pwsh
        run: |
          choco install postgresql -y --params '/Password:pass'
          $pgBin = (Resolve-Path "C:\Program Files\PostgreSQL\*\bin").Path
          echo $pgBin >> $env:GITHUB_PATH
          $env:PATH = "$pgBin;" + $env:PATH
          $env:PGPASSWORD = "pass"
          & psql -U postgres -c "CREATE USER `"user`" WITH PASSWORD 'pass' SUPERUSER CREATEDB;"

      - name: Smoke test
        run: dart run example/example.dart
